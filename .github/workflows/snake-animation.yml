name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: itsmrroot
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats SVG
        run: |
          mkdir -p dist
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://streak-stats.demolab.com/?user=itsmrroot&background=0d1117&border=00ff41&ring=00ff41&fire=39d353&currStreakNum=c9d1d9&sideNums=c9d1d9&currStreakLabel=00ff41&sideLabels=00ff41&dateFormat=Y-m-d" \
            -o dist/github-streak-stats-dark.svg
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://streak-stats.demolab.com/?user=itsmrroot&background=f0fff4&border=00aa2f&ring=00aa2f&fire=00cc44&currStreakNum=0d1117&sideNums=0d1117&currStreakLabel=00aa2f&sideLabels=00aa2f&dateFormat=Y-m-d" \
            -o dist/github-streak-stats.svg

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: ./dist
          publish_branch: output
          destination_dir: ./
